<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE BUTCHERS KITCHEN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: sticky category rail over a single-column menu list; order panel sits right on desktop, slides up from a bottom bar on phones. */
:root{
  --bg:#f2f4f0; --surface:#ffffff; --ink:#15231b; --muted:#5b6b61; --line:#d9dfd8;
  --accent:#c4321e; --accent-ink:#ffffff; --leaf:#2d6a4d; --leaf-soft:#dfeee5;
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101a14; --surface:#18251d; --ink:#eef3ee; --muted:#9db0a3; --line:#2b3c31;
  --accent:#ef6a52; --accent-ink:#1a0804; --leaf:#6fcf9c; --leaf-soft:#1f3a2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a14; --surface:#18251d; --ink:#eef3ee; --muted:#9db0a3; --line:#2b3c31;
  --accent:#ef6a52; --accent-ink:#1a0804; --leaf:#6fcf9c; --leaf-soft:#1f3a2c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
header.top{padding:28px 0 18px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
header.top h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em}
header.top p{margin:6px 0 0;color:var(--muted);max-width:44ch}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{font-size:.85rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.fact b{color:var(--leaf)}
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start;padding-top:20px}
.section{margin-bottom:28px}
.section h2{font-size:1.5rem;margin-bottom:4px}
.section .note{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.dish{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px 0;border-top:1px solid var(--line)}
.dish h3{font-size:1.1rem;font-weight:600;font-family:var(--font-body)}
.dish p{margin:2px 0 0;color:var(--muted);font-size:.92rem;max-width:56ch}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--leaf);background:var(--leaf-soft);padding:2px 8px;border-radius:4px}
.tag.hot{color:var(--accent);background:transparent;border:1px solid var(--accent)}
.price{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dish .act{grid-column:2;justify-self:end}
.add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:8px 18px;border-radius:8px;cursor:pointer}
.add:hover{filter:brightness(1.08)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.step button{border:0;background:transparent;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
.step button:hover{background:var(--leaf-soft)}
.step output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
aside.panel{position:sticky;top:72px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-height:calc(100vh - 90px);overflow:auto}
aside.panel h2{font-size:1.3rem;margin-bottom:10px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.line .nm{font-weight:500}
.line .sub{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);padding:14px 0}
.totals{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;display:grid;gap:4px}
.totals div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.totals .grand{font-weight:800;font-size:1.15rem}
.primary{width:100%;margin-top:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:13px;border-radius:10px;cursor:pointer;font-size:1rem}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:transparent;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:500}
form.co{display:grid;gap:12px;margin-top:6px}
label{display:grid;gap:4px;font-size:.88rem;font-weight:500}
input[type=text],input[type=tel],textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;font-weight:500}
.seg input{accent-color:var(--accent)}
.err{color:var(--accent);font-size:.85rem;min-height:1.2em}
.done h2{color:var(--leaf)}
.done pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--font-body);font-size:.9rem;margin:10px 0}
.done .row{display:flex;gap:8px;flex-wrap:wrap}
.done a.primary{display:block;text-align:center;text-decoration:none}
.bar{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.panel{position:fixed;inset:auto 0 0 0;top:auto;max-height:88vh;border-radius:16px 16px 0 0;z-index:20;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  body.open aside.panel{transform:none}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
  .bar button{width:100%;display:flex;justify-content:space-between;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 18px;border-radius:12px;cursor:pointer}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
  .closer{display:inline-block}
}
@media (min-width:821px){.closer{display:none}}
@media (prefers-reduced-motion:reduce){aside.panel{transition:none}}
footer{color:var(--muted);font-size:.82rem;padding:24px 0}
.navbar ul{
    list-style: none;
    display: flex;
    gap: 30px;}

    .navbar ul li a{
    color:#fff;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s ease;
}
.navbar ul li a:hover{
    color:#1a3340;}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="shopName">THE BUTCHERS KITCHEN</h1>
      <p>Coastal and upcountry home cooking. Order here and we get cooking.</p>
    </div>
    <div class="facts">
      <span class="fact">Open <b>09.30 am to 10:00pm</b></span>
      <span class="fact">Delivery <b id="feeFact"></b></span>
      <span class="fact">Pay by <b>M-Pesa or cash</b></span>
    </div>
    <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contacts</a></li>
            <li><a href="#">About</a></li>
        </ul>
  </header>

  <nav class="cats" id="cats" aria-label="Menu categories"></nav>

  <div class="layout">
    <main id="menu"></main>
    <aside class="panel" id="panel" aria-label="Your order"></aside>
  </div>

  <footer>Prices in Kenya shillings. Allergies? Add a note when you order.</footer>
</div>

<div class="bar"><button id="barBtn" type="button"><span id="barCount">View order</span><span id="barTotal"></span></button></div>

<script>
/* Edit this block to change the restaurant. Prices are in KES. */
const CONFIG = {
  name: "THE BUTCHERS KITCHEN",
  whatsapp: "254726791638",   // restaurant WhatsApp number, country code first, no + or spaces
  deliveryFee: 50,
  freeDeliveryOver: 1500,
  minOrder: 30,
};
const MENU = [
  {cat:"Mains", note:"Served with kachumbari.", items:[
    {id:"m1", name:"Ugali na kuku", desc:"Charcoal-grilled chicken breast, salt and pepper, served with ugali.", price:160, tags:["Best seller"]},
    {id:"m2", name:"Pilau na chicken", desc:"Spiced rice cooked with chicken in the pot, topped with fried onions.", price:180},
    {id:"m3", name:"Pilau plain", desc:"Rice cooked with healthy spices like the masala.", price:100, tags:["Spicy"]},
    {id:"m4", name:"Chapati kuku", desc:"Two layered chapatis with fried chicken.", price:160},
    {id:"m5", name:"Biriani chicken", desc:"Chicken marinated with a touch of sweet rice.", price:190},
    {id:"m6", name:"Fries plain", desc:"loaded fries which are crunchy.",price:100},
    {id:"m7", name:"Fries with chicken", desc:"loaded fries with chicken thigh.",price:260}
  ]},
  {cat:"Chicken side", note:"Catch of the day, cooked whole.", items:[
    {id:"s1", name:"Roasted chicken", desc:"Full grilled chicken.", price:540},
    {id:"s2", name:"Fried Chicken", desc:"Whole fried chicken", price:600},
    {id:"s3", name:"Marinated chicken", desc:"Chicken marinated in lemon,garlic and pili pili.", price:800, tags:["Spicy"]}
  ]},
  {cat:"Sides", items:[
    {id:"d1", name:"Masala chips", desc:"Fries tossed in a tomato and chili masala.", price:250, tags:["Vegetarian","Spicy"]},
    {id:"d2", name:"Kachumbari", desc:"Tomato, onion, coriander, pinapple.", price:100, tags:["Vegetarian"]},
    {id:"d3", name:"Chapati (each)", desc:"Soft, layered, fried on the griddle.", price:30, tags:["Vegetarian"]},
    {id:"d4", name:"Mandazi (4 pieces)", desc:"Cardamom and coconut doughnuts.", price:150, tags:["Vegetarian"]}
  ]},
  {cat:"Drinks", items:[
    {id:"k1", name:"Uji power", desc:"A healthy porraige made by cassava,milk and sugar.", price:150, tags:["bestServedHot"]},
    {id:"k2", name:"Passion juice", desc:"Fresh pressed, no added sugar.", price:100},
    {id:"k3", name:"Mango and ginger", desc:"Blended with crushed ice.", price:150},
    {id:"k4", name:"Soda (500 ml)", desc:"Coke, Fanta or Sprite.", price:100}
  ]}
];

const $ = s => document.querySelector(s);
const fmt = n => "KES " + n.toLocaleString("en-KE");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId = {}; MENU.forEach(c => c.items.forEach(i => byId[i.id] = i));

let cart = {};
let stage = "cart";          // cart | checkout | done
let mode = "delivery";
let form = {name:"", phone:"", address:"", notes:"", pay:"mpesa"};
let placed = null;
try { const s = JSON.parse(localStorage.getItem("kk-cart")||"{}"); Object.keys(s).forEach(k => { if(byId[k] && s[k]>0) cart[k]=s[k]; }); } catch(e){}
const save = () => { try { localStorage.setItem("kk-cart", JSON.stringify(cart)); } catch(e){} };

document.title = CONFIG.name;
$("#shopName").textContent = CONFIG.name;
$("#feeFact").textContent = fmt(CONFIG.deliveryFee) + " (free over " + fmt(CONFIG.freeDeliveryOver) + ")";

const count = () => Object.values(cart).reduce((a,b)=>a+b,0);
const subtotal = () => Object.entries(cart).reduce((a,[id,q]) => a + byId[id].price*q, 0);
const fee = () => mode==="delivery" && subtotal()>0 && subtotal()<CONFIG.freeDeliveryOver ? CONFIG.deliveryFee : 0;
const total = () => subtotal() + fee();

function renderCats(){
  $("#cats").innerHTML = MENU.map(c => `<button class="cat" type="button" data-cat="${esc(c.cat)}" aria-pressed="false">${esc(c.cat)}</button>`).join("");
}
function renderMenu(){
  $("#menu").innerHTML = MENU.map(c => `
    <section class="section" id="cat-${esc(c.cat)}">
      <h2>${esc(c.cat)}</h2>${c.note?`<p class="note">${esc(c.note)}</p>`:`<p class="note"></p>`}
      ${c.items.map(i => `
        <article class="dish" data-id="${i.id}">
          <div><h3>${esc(i.name)}</h3><p>${esc(i.desc)}</p>
            ${i.tags?`<div class="tags">${i.tags.map(t=>`<span class="tag ${t==="Spicy"?"hot":""}">${esc(t)}</span>`).join("")}</div>`:""}
          </div>
          <div class="price">${fmt(i.price)}</div>
          <div class="act" data-act-for="${i.id}"></div>
        </article>`).join("")}
    </section>`).join("");
  MENU.forEach(c => c.items.forEach(i => renderAct(i.id)));
}
function renderAct(id){
  const el = document.querySelector(`[data-act-for="${id}"]`); if(!el) return;
  const q = cart[id]||0;
  el.innerHTML = q
    ? `<span class="step"><button type="button" data-dec="${id}" aria-label="Remove one ${esc(byId[id].name)}">&minus;</button><output>${q}</output><button type="button" data-inc="${id}" aria-label="Add one ${esc(byId[id].name)}">+</button></span>`
    : `<button class="add" type="button" data-inc="${id}">Add</button>`;
}

function renderBar(){
  const n = count();
  $("#barCount").textContent = n ? `View order (${n})` : "Your order is empty";
  $("#barTotal").textContent = n ? fmt(subtotal()) : "";
}

function cartLines(){
  return Object.entries(cart).map(([id,q]) => {
    const i = byId[id];
    return `<div class="line"><div><div class="nm">${esc(i.name)}</div><div class="sub">${fmt(i.price)} each</div></div>
      <div class="price">${fmt(i.price*q)}</div>
      <div><span class="step"><button type="button" data-dec="${id}" aria-label="Remove one ${esc(i.name)}">&minus;</button><output>${q}</output><button type="button" data-inc="${id}" aria-label="Add one ${esc(i.name)}">+</button></span></div></div>`;
  }).join("");
}
function totalsBlock(){
  return `<div class="totals">
    <div><span>Subtotal</span><span>${fmt(subtotal())}</span></div>
    ${mode==="delivery"?`<div><span>Delivery</span><span>${fee()?fmt(fee()):"Free"}</span></div>`:""}
    <div class="grand"><span>Total</span><span>${fmt(total())}</span></div></div>`;
}

function renderPanel(){
  const p = $("#panel");
  const close = `<button class="ghost closer" type="button" data-close style="float:right">Close</button>`;
  if(stage==="done"){
    p.innerHTML = `${close}<div class="done"><h2>Order ready, ${esc(placed.name)}</h2>
      <p>Your order number is <b>${esc(placed.no)}</b>. It is not with the kitchen yet. Send it on WhatsApp so we can confirm and start cooking.</p>
      <pre>${esc(placed.text)}</pre>
      <a class="primary" href="${esc(placed.link)}" target="_blank" rel="noopener">Send order on WhatsApp</a>
      <div class="row" style="margin-top:10px"><button class="ghost" type="button" id="copyBtn">Copy order text</button><button class="ghost" type="button" id="newBtn">Start a new order</button></div>
      <p class="err" id="copyMsg" role="status"></p></div>`;
    return;
  }
  if(!count()){
    p.innerHTML = `${close}<h2>Your order</h2><p class="empty">Nothing here yet. Add a dish from the menu.</p>`;
    return;
  }
  if(stage==="cart"){
    p.innerHTML = `${close}<h2>Your order</h2>${cartLines()}${totalsBlock()}
      <button class="primary" type="button" id="toCheckout">Checkout</button>`;
    return;
  }
  p.innerHTML = `${close}<h2>Checkout</h2>
    <form class="co" id="coForm" novalidate>
      <div class="seg" role="radiogroup" aria-label="Delivery or pickup">
        <label><input type="radio" name="mode" value="delivery" ${mode==="delivery"?"checked":""}> Delivery</label>
        <label><input type="radio" name="mode" value="pickup" ${mode==="pickup"?"checked":""}> Pickup</label>
      </div>
      <label for="f-name">Your name<input id="f-name" type="text" name="name" autocomplete="name" value="${esc(form.name)}"></label>
      <label for="f-phone">Phone number<input id="f-phone" type="tel" name="phone" autocomplete="tel" placeholder="0712 345 678" value="${esc(form.phone)}"></label>
      ${mode==="delivery"?`<label for="f-addr">Delivery address<textarea id="f-addr" name="address" rows="2" placeholder="Estate, road, building, landmark">${esc(form.address)}</textarea></label>`:`<p class="sub" style="margin:0;color:var(--muted)">Collect at the counter. We will message you when it is ready.</p>`}
      <label for="f-notes">Notes for the kitchen (optional)<textarea id="f-notes" name="notes" rows="2">${esc(form.notes)}</textarea></label>
      <div class="seg" role="radiogroup" aria-label="Payment">
        <label><input type="radio" name="pay" value="mpesa" ${form.pay==="mpesa"?"checked":""}> M-Pesa</label>
        <label><input type="radio" name="pay" value="cash" ${form.pay==="cash"?"checked":""}> Cash</label>
      </div>
      ${totalsBlock()}
      <div class="err" id="err" role="alert"></div>
      <button class="primary" type="submit" style="margin-top:0">Place order</button>
      <button class="ghost" type="button" id="backCart">Back to order</button>
    </form>`;
}

function refresh(id){
  if(id) renderAct(id);
  renderBar();
  renderPanel();
}

function change(id, d){
  const q = Math.max(0, (cart[id]||0) + d);
  if(q) cart[id] = q; else delete cart[id];
  if(!count() && stage==="checkout") stage = "cart";
  save(); refresh(id);
}

function readForm(){
  const f = $("#coForm"); if(!f) return;
  const g = n => f.elements[n] ? f.elements[n].value : "";
  form.name = g("name").trim(); form.phone = g("phone").trim();
  if(f.elements.address) form.address = g("address").trim();
  form.notes = g("notes").trim();
}

function placeOrder(){
  readForm();
  const err = $("#err");
  const digits = form.phone.replace(/\D/g,"");
  if(subtotal() < CONFIG.minOrder){ err.textContent = "The minimum order is " + fmt(CONFIG.minOrder) + "."; return; }
  if(!form.name){ err.textContent = "Please enter your name."; $("#f-name").focus(); return; }
  if(digits.length < 9){ err.textContent = "Please enter a phone number we can reach."; $("#f-phone").focus(); return; }
  if(mode==="delivery" && !form.address){ err.textContent = "Please enter a delivery address."; $("#f-addr").focus(); return; }
  const no = "KK-" + String(Date.now()).slice(-5);
  const lines = Object.entries(cart).map(([id,q]) => `${q} x ${byId[id].name} (${fmt(byId[id].price*q)})`);
  const text = [
    `New order ${no} for ${CONFIG.name}`,
    ...lines,
    `Subtotal: ${fmt(subtotal())}`,
    mode==="delivery" ? `Delivery: ${fee()?fmt(fee()):"Free"}` : "Pickup",
    `Total: ${fmt(total())}`,
    `Pay by: ${form.pay==="mpesa"?"M-Pesa":"Cash"}`,
    `Name: ${form.name}`, `Phone: ${form.phone}`,
    mode==="delivery" ? `Address: ${form.address}` : "",
    form.notes ? `Notes: ${form.notes}` : ""
  ].filter(Boolean).join("\n");
  placed = {no, name: form.name, text, link: "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(text)};
  stage = "done"; renderPanel();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.inc){ change(t.dataset.inc, 1); return; }
  if(t.dataset.dec){ change(t.dataset.dec, -1); return; }
  if(t.dataset.cat){ document.getElementById("cat-"+t.dataset.cat).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth", block:"start"}); return; }
  if(t.id==="barBtn"){ document.body.classList.add("open"); if(!document.querySelector(".scrim")){ const s=document.createElement("div"); s.className="scrim"; s.addEventListener("click",closePanel); document.body.appendChild(s);} return; }
  if(t.dataset.close!==undefined){ closePanel(); return; }
  if(t.id==="toCheckout"){ stage="checkout"; renderPanel(); return; }
  if(t.id==="backCart"){ readForm(); stage="cart"; renderPanel(); return; }
  if(t.id==="newBtn"){ cart={}; save(); stage="cart"; placed=null; document.querySelectorAll("[data-act-for]").forEach(el=>renderAct(el.dataset.actFor)); renderBar(); renderPanel(); closePanel(); return; }
  if(t.id==="copyBtn"){
    const msg = $("#copyMsg");
    const fallback = () => { const r=document.createRange(); r.selectNodeContents(document.querySelector(".done pre")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent="Order text selected. Copy it manually."; };
    try { navigator.clipboard.writeText(placed.text).then(()=>{msg.style.color="var(--leaf)";msg.textContent="Copied.";}, fallback); } catch(x){ fallback(); }
  }
});
function closePanel(){ document.body.classList.remove("open"); const s=document.querySelector(".scrim"); if(s) s.remove(); }
document.addEventListener("submit", e => { if(e.target.id==="coForm"){ e.preventDefault(); placeOrder(); } });
document.addEventListener("change", e => {
  if(!e.target.closest("#coForm")) return;
  if(e.target.name==="mode"){ readForm(); mode=e.target.value; renderPanel(); }
  if(e.target.name==="pay"){ form.pay=e.target.value; }
});
document.addEventListener("keydown", e => { if(e.key==="Escape") closePanel(); });

/* highlight the category in view */
function watchCats(){
  const btns = [...document.querySelectorAll(".cat")];
  const secs = MENU.map(c => document.getElementById("cat-"+c.cat));
  const onScroll = () => {
    let cur = 0; secs.forEach((s,i) => { if(s.getBoundingClientRect().top < 120) cur = i; });
    btns.forEach((b,i) => b.setAttribute("aria-pressed", i===cur ? "true":"false"));
  };
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
}

renderCats(); renderMenu(); renderBar(); renderPanel(); watchCats();
</script>

</html>
